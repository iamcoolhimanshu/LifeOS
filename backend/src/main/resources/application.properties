# Datasource MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lifeos}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:HIMANSHU}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate MySQL Configurations
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# LifeOS Configuration
lifeos.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
lifeos.jwt.expiration-ms=86400000
lifeos.jwt.refresh-expiration-ms=604800000

lifeos.ai.provider=${AI_PROVIDER:mock}
lifeos.ai.groq.api-key=${GROQ_API_KEY:mock-key}

lifeos.upload.dir=${UPLOAD_DIR:./src/resouces/uploads}


spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# SMTP Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
lifeos.mail.from-address=${MAIL_FROM_ADDRESS:noreply@lifeos.com}
lifeos.mail.from-name=${MAIL_FROM_NAME:LifeOS Brain}

# OAuth Token Encryption Key
lifeos.oauth.encryption-key=${OAUTH_ENCRYPTION_KEY:fallback-default-key-for-lifeos-tokens-32}

# Google OAuth Configuration
lifeos.google.client-id=${GOOGLE_CLIENT_ID:}
lifeos.google.client-secret=${GOOGLE_CLIENT_SECRET:}
lifeos.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}
