<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #e2e8f0;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 0;
    }
    .subtitle {
      font-size: 9px;
      color: #06b6d4;
      font-weight: 600;
      text-transform: uppercase;
      margin: 0;
    }
    .gear-btn {
      background: #111827;
      border: 1px solid #1f2937;
      color: #94a3b8;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .gear-btn:hover {
      color: #06b6d4;
      border-color: #06b6d4;
    }
    .settings-panel {
      display: none;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .settings-panel.active {
      display: block;
    }
    .server-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      color: #94a3b8;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .preset-btns {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .btn-preset {
      flex: 1;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 4px 6px;
      font-size: 9px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-preset:hover {
      background: #334155;
      color: #fff;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 10px;
      font-weight: bold;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      color: #f3f4f6;
      padding: 8px 10px;
      font-size: 12px;
      box-sizing: border-box;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #06b6d4;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      margin-top: 6px;
    }
    .status {
      display: none;
      font-size: 11px;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .status.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #10b981;
      display: block;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-brand">
      <div class="logo">L</div>
      <div>
        <h1 class="title">LifeOS Clipper</h1>
        <p class="subtitle">AI Second Brain</p>
      </div>
    </div>
    <button class="gear-btn" id="toggleSettingsBtn" title="Server URL Settings">⚙️</button>
  </div>

  <!-- Server Settings Panel -->
  <div class="settings-panel" id="settingsPanel">
    <label for="serverUrlInput">LifeOS Backend Server URL</label>
    <input type="text" id="serverUrlInput" placeholder="https://lifeos-backend-qxsy.onrender.com">
    <div class="preset-btns">
      <button class="btn-preset" id="presetProdBtn">Cloud Render</button>
      <button class="btn-preset" id="presetLocalBtn">Localhost 8080</button>
    </div>
    <button class="btn btn-secondary" id="saveServerUrlBtn">Save Server URL</button>
  </div>

  <div class="server-badge" id="activeServerBadge">Server: http://localhost:8080</div>

  <!-- Login View -->
  <div id="loginView">
    <div class="field">
      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" placeholder="Enter your username">
    </div>
    <div class="field">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="Enter your password">
    </div>
    <button class="btn" id="loginBtn">Log In</button>
  </div>

  <!-- Clipper View -->
  <div id="clipperView" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 11px; color: #94a3b8; background: #111827; padding: 6px 10px; border-radius: 6px; border: 1px solid #1f2937;">
      <span>Logged in as: <strong id="loggedInUser" style="color: #06b6d4;">User</strong></span>
      <a href="#" id="logoutLink" style="color: #ef4444; text-decoration: none; font-weight: bold; cursor: pointer;">Logout</a>
    </div>

    <div class="field">
      <label for="titleInput">Note Title</label>
      <input type="text" id="titleInput" placeholder="Title">
    </div>

    <div class="field">
      <label for="contentInput">Note Content / Highlights</label>
      <textarea id="contentInput" rows="4" placeholder="Type content or paste text details here..."></textarea>
    </div>

    <button class="btn" id="saveBtn">Clip to LifeOS</button>
  </div>
  
  <div class="status" id="statusMessage"></div>

  <script src="popup.js"></script>
</body>
</html>
