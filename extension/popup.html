<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #e2e8f0;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 0;
    }
    .subtitle {
      font-size: 9px;
      color: #06b6d4;
      font-weight: 600;
      text-transform: uppercase;
      margin: 0;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 10px;
      font-weight: bold;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      color: #f3f4f6;
      padding: 8px 10px;
      font-size: 12px;
      box-sizing: border-box;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #06b6d4;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .status {
      display: none;
      font-size: 11px;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .status.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #10b981;
      display: block;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">L</div>
    <div>
      <h1 class="title">LifeOS Clipper</h1>
      <p class="subtitle">AI Second Brain</p>
    </div>
  </div>

  <!-- Login View -->
  <div id="loginView">
    <div class="field">
      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" placeholder="Enter your username">
    </div>
    <div class="field">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="Enter your password">
    </div>
    <button class="btn" id="loginBtn">Log In</button>
  </div>

  <!-- Clipper View -->
  <div id="clipperView" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 11px; color: #94a3b8; background: #111827; padding: 6px 10px; border-radius: 6px; border: 1px solid #1f2937;">
      <span>Logged in as: <strong id="loggedInUser" style="color: #06b6d4;">User</strong></span>
      <a href="#" id="logoutLink" style="color: #ef4444; text-decoration: none; font-weight: bold; cursor: pointer;">Logout</a>
    </div>

    <div class="field">
      <label for="titleInput">Note Title</label>
      <input type="text" id="titleInput" placeholder="Title">
    </div>

    <div class="field">
      <label for="contentInput">Note Content / Highlights</label>
      <textarea id="contentInput" rows="4" placeholder="Type content or paste text details here..."></textarea>
    </div>

    <button class="btn" id="saveBtn">Clip to LifeOS</button>
  </div>
  
  <div class="status" id="statusMessage"></div>

  <script src="popup.js"></script>
</body>
</html>
