<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 64 64">
  <defs>
    <!-- Background glow gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Outer rings glow -->
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Glowing outer circle -->
  <circle cx="32" cy="32" r="30" fill="url(#glow-grad)" />

  <!-- Main border gradient ring -->
  <circle cx="32" cy="32" r="26" stroke="url(#bg-grad)" stroke-width="2" stroke-dasharray="4 2" opacity="0.6" />

  <!-- Inside circular background container -->
  <circle cx="32" cy="32" r="22" fill="#090d16" stroke="url(#bg-grad)" stroke-width="2.5" />

  <!-- Stylized AI Digital Brain Node Network -->
  <!-- Left hemisphere (Cyan) -->
  <path d="M32,18 C25,18 20,22 20,28 C20,33 24,35 25,38 C26,40 25,43 28,45 C29,46 30,46 32,46 Z" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  
  <!-- Right hemisphere (Purple) -->
  <path d="M32,18 C39,18 44,22 44,28 C44,33 40,35 39,38 C38,40 39,43 36,45 C35,46 34,46 32,46 Z" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Central neural trunk line -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="url(#bg-grad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Interactive Network Nodes (glow dots) -->
  <circle cx="32" cy="18" r="3" fill="#ffffff" stroke="#a855f7" stroke-width="1" />
  <circle cx="20" cy="28" r="3" fill="#06b6d4" stroke="#ffffff" stroke-width="1" />
  <circle cx="44" cy="28" r="3" fill="#a855f7" stroke="#ffffff" stroke-width="1" />
  <circle cx="25" cy="38" r="2.5" fill="#06b6d4" stroke="#ffffff" stroke-width="1" />
  <circle cx="39" cy="38" r="2.5" fill="#a855f7" stroke="#ffffff" stroke-width="1" />
  <circle cx="28" cy="45" r="3.5" fill="#ffffff" stroke="#06b6d4" stroke-width="1" />
  <circle cx="36" cy="45" r="3.5" fill="#ffffff" stroke="#a855f7" stroke-width="1" />
  
  <!-- Connecting synapse rays (cyan/purple cross connections) -->
  <line x1="32" y1="18" x2="20" y2="28" stroke="#06b6d4" stroke-width="1.2" opacity="0.6" />
  <line x1="32" y1="18" x2="44" y2="28" stroke="#a855f7" stroke-width="1.2" opacity="0.6" />
  <line x1="20" y1="28" x2="25" y2="38" stroke="#06b6d4" stroke-width="1.2" opacity="0.6" />
  <line x1="44" y1="28" x2="39" y2="38" stroke="#a855f7" stroke-width="1.2" opacity="0.6" />
  <line x1="25" y1="38" x2="28" y2="45" stroke="#06b6d4" stroke-width="1.2" opacity="0.6" />
  <line x1="39" y1="38" x2="36" y2="45" stroke="#a855f7" stroke-width="1.2" opacity="0.6" />
  <line x1="32" y1="32" x2="25" y2="38" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
  <line x1="32" y1="32" x2="39" y2="38" stroke="#a855f7" stroke-width="1" opacity="0.5" />
</svg>